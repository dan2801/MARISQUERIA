{% extends 'base.html' %}

{% block content %}
    <h2 style="text-align: center;">Administrar usuarios</h2>
    <div class="buttons_container">
        <button onclick="openModalAddUser()" class="btn">Agregar usuario</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.rol }}</td>
                <td>
                    <button type="submit" onclick="openModalEdit({{ user.id }})" class="btn">
                        <svg xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 512 512"><path fill="#f3e5dc" d="M362.7 19.3L314.3 67.7 444.3 197.7l48.4-48.4c25-25 25-65.5 0-90.5L453.3 19.3c-25-25-65.5-25-90.5 0zm-71 71L58.6 323.5c-10.4 10.4-18 23.3-22.2 37.4L1 481.2C-1.5 489.7 .8 498.8 7 505s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L421.7 220.3 291.7 90.3z"/></svg>
                    </button>

                    <button type="submit" onclick="deleteUser({{ user.id }})" class="btn">Eliminar</button>

                    <!-- Ventana modal para editar items -->
                    <div id="modal_edit{{ user.id }}" class="modal">
                        <div class="modal-content">
                            <span class="close" onclick="closeModalEdit({{ user.id }})">&times;</span>
                            <h2>Editar usuario</h2>

                            <form action="{{ url_for('edit_user', id=user.id) }}" method="POST" enctype="multipart/form-data">
                                <label for="username">Nombre de usuario:</label>
                                <input type="text" name="username" value="{{ user.username }}" required>

                                <label for="rol">Rol:</label>
                                <select name="rol" required>
                                    <option value="admin" {% if user.rol == 'admin' %}selected{% endif %}>Admin</option>
                                    <option value="user" {% if user.rol == 'user' %}selected{% endif %}>User</option>
                                    <option value="cajero" {% if user.rol == 'cajero' %}selected{% endif %}>Cajero</option>
                                </select>

                                <label for="password">Contraseña:</label>
                                <input type="password" name="password" placeholder="Contraseña">

                                <button type="submit" class="btn">Actualizar</button>
                            </form>
                        </div>
                    </div>

                    <!-- Ventana modal para eliminar items -->
                    <div id="modal_delete{{ user.id }}" class="modal">
                        <div class="modal-content">
                            <span class="close" onclick="closeModalDelete({{ user.id }})">&times;</span>
                            <h2>Eliminar usuario</h2>
                            <p>¿Estás seguro de que deseas eliminar este usuario?</p>
                            <form action="{{ url_for('delete_user', id=user.id) }}" method="POST">
                                <button type="submit" class="btn">Eliminar</button>
                            </form>
                        </div>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Ventana modal para agregar items -->
    <div id="modal_add_user" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModalAddUser()">&times;</span>
            <h2>Agregar usuario</h2>

            <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data">
                <label for="username">Nombre de usuario:</label>
                <input type="text" name="username" required>

                <label for="rol">Rol:</label>
                <select name="rol" required>
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                    <option value="cajero">Cajero</option>
                </select>

                <label for="password">Contraseña:</label>
                <input type="password" name="password" required>

                <button type="submit" class="btn">Agregar</button>
            </form>
        </div>
    </div>

    <script>
        function openModalEdit(id) {
            const modal = document.getElementById('modal_edit' + id);
            modal.classList.add('show');
        }

        function closeModalEdit(id) {
            document.getElementById('modal_edit' + id).classList.remove('show');
        }

        function openModalAddUser() {
            const modal = document.getElementById('modal_add_user');
            modal.classList.add('show');
        }

        function closeModalAddUser() {
            document.getElementById('modal_add_user').classList.remove('show');
        }

        function deleteUser(id) {
            const modal = document.getElementById('modal_delete' + id);
            modal.classList.add('show');
        }

        function closeModalDelete(id) {
            document.getElementById('modal_delete' + id).classList.remove('show');
        }
    </script>
{% endblock %}
