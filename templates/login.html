<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/seguridad.js') }}"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marisquería La Flor del Puerto</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</head>
<body>
    <div class="fondo"></div>

    <div class="login-container">
        <div class="login-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo-img">
            <h1 class="titulo">Marisquería La Flor del Puerto</h1>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" name="username" placeholder="Ingresa tu usuario" required />

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="password" placeholder="Ingresa tu contraseña" required />

            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div id="flash-messages" style="display:none;">
                {% for category, message in messages %}
                    <div class="flash-message" data-category="{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- Modal de alerta -->
    <div id="modal-flash" class="modal modal-flash">
        <div class="modal-content">
            <span class="close" onclick="closeFlashModal()">&times;</span>
            <p id="flash-message-text"></p>
        </div>
    </div>
</body>
</html>
